[package]
name = "cursorcue"
version.workspace = true
edition.workspace = true

[dependencies]
cursorcue-core = { path = "../crates/cursorcue-core" }
cursorcue-config = { path = "../crates/cursorcue-config" }
cursorcue-render = { path = "../crates/cursorcue-render" }
cursorcue-platform-windows = { path = "../crates/cursorcue-platform-windows" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
